map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Port 80 is the landing page and the certbot challenge.
# The control API is the per-node server on controlPort.
server {
    listen 80 default_server;
    server_name _;

    root /etc/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }
}

# По одному файлу на ноду: deploy.sh → generated/nginx/nodes/node-fl-1.conf и т.д.
include /etc/nginx/conf.d/nodes/*.conf;
