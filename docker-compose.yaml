version: "3.9"

networks:
  instance-network:
    name: instance-network

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-certs:/etc/nginx/certs:ro
      - ./index.html:/etc/nginx/html/index.html
    depends_on:
      - xray
    networks:
      - instance-network

  xray:
    image: teddysun/xray
    container_name: xray
    volumes:
      - ./xray-config.json:/etc/xray/config.json
    command: xray run -config /etc/xray/config.json
    networks:
      - instance-network
    restart: unless-stopped

  nest-app:
    container_name: nest-app
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.nestjs
    networks:
      - instance-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    privileged: true
    networks:
      - instance-network

  # Host CPU / RAM / disk / network for Grafana via Prometheus scrape :9100/metrics
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - instance-network
    pid: host